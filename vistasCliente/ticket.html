<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="ticket-main">
      <div class="ticket">
        <h2 class="ticket-titulo">TechStore</h2>
        <p class="ticket-parrafo">Comprobante de compra</p>

        <div class="ticket-datos">
          <p>Cliente: <span id="nombre-cliente"></span></p>
          <p>Fecha: <span id="fecha"></span></p>
        </div>

        <hr class="ticket-linea" />

        <div id="contenedor-ticket"></div>

        <hr class="ticket-linea" />

        <h3 class="ticket-total">Total: $<span id="total">0</span></h3>

        <p class="ticket-gracias">¡Gracias por su compra!</p>
      </div>

      <button id="descargar-pdf">Descargar ticket PDF</button>

      <button id="volver">Volver a empezar</button>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="js/ticket.js"></script>
  </body>
</html>
